<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#005073" />
    <!-- PWA instalable en iOS: sin esto, Safari no ofrece "Agregar a
         inicio" en pantalla completa (display: standalone) — Apple no lee
         el manifest.webmanifest para esto, solo estas meta tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ProPatient" />
    <title>ProPatient — Agenda tu cita médica en línea</title>
    <meta name="description" content="Encuentra doctores por especialidad o ubicación y solicita tu cita en línea sin crear una cuenta. Para consultorios: gestiona tu agenda, pacientes y expediente clínico digital." />

    <!-- Open Graph / redes sociales. og:image queda pendiente hasta tener
         una imagen de portada diseñada; complétalo cuando la tengas. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProPatient" />
    <meta property="og:title" content="ProPatient — Agenda tu cita médica en línea" />
    <meta property="og:description" content="Encuentra doctores por especialidad o ubicación y solicita tu cita en línea sin crear una cuenta." />
    <meta property="og:url" content="https://propatient.pro/" />
    <meta property="og:locale" content="es_MX" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ProPatient — Agenda tu cita médica en línea" />
    <meta name="twitter:description" content="Encuentra doctores por especialidad o ubicación y solicita tu cita en línea sin crear una cuenta." />

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

services:
  # --- BASE DE DATOS ---
  db:
    image: postgres:15-alpine
    container_name: propatient-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en tu archivo .env (ver .env.example)}
      POSTGRES_DB: propatient
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- BACKEND (GO) ---
  backend:
    build: ./PropatientGo
    container_name: propatient-api
    ports:
      - "8095:8095"
    depends_on:
      - db
    environment:
      # @db es el nombre del servicio de arriba. Docker resuelve la IP solo.
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en tu archivo .env (ver .env.example)}@db:5432/propatient?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en tu archivo .env (ver .env.example)}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-744896665247-hrs7pmi72q2pog5dn9h1fh5n4nkpv18r.apps.googleusercontent.com}
      - PORT=8095
    volumes:
      - ./PropatientGo:/app:Z

  # --- FRONTEND (REACT) ---
  frontend:
    build: ./propatient-frontend
    container_name: propatient-web
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8095/api
    volumes:
      - ./propatient-frontend:/app:Z
      - /app/node_modules

volumes:
  postgres_data: